name: Trigger Website Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger tiongchong.github.io deployment
        run: |
          curl -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SITE_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tiongchong/tiongchong.github.io/dispatches \
            -d '{"event_type":"sync-external-content","client_payload":{"source":"the-morning-word"}}'
